services:
  users-ping-bot:
    image: users-ping-bot:${APP_VERSION}
    container_name: users-ping-bot
    restart: unless-stopped
    user: "10001:10001"
    env_file:
      - .env
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    # No ports: - nothing is published; the bot only makes outbound calls.
    volumes:
      # Named + explicit `name:` so a different compose project/directory can
      # never point at (or silently create) a different, empty database.
      - upb-data:/data
    tmpfs:
      - /tmp:size=16m
    cpus: 0.25
    # Measured in this image with a 2000-subscriber list (far above the
    # 1-2 users this bot is sized for): peak RSS 168 MiB with migrations,
    # aiogram and a full subscriber render. 128m is OOM-killed during
    # startup (exit 137); 192m completes the same run with ~24 MiB spare
    # and 256m peaks at the identical 168 MiB, so the extra cap buys
    # nothing. Raise this only against observed production numbers.
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 64
    ulimits:
      core: 0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Stable explicit name: `docker compose down -v` (or a compose project
  # rename) destroys this database. Never run `down -v` as part of an
  # upgrade; it is a deliberate, separate, destructive operation.
  upb-data:
    name: upb-data
